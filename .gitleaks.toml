[extend]
useDefault = true

# Cilium Helm-generated template TLS certificates that existed in a historical commit.
# The manifest (kina-cli/manifests/cilium.yaml) has been removed, but the certs
# remain in git history. These were placeholder certs, not real secrets.
[[allowlists]]
description = "historical Cilium manifest template certs"
commits = ["e7fa62a6091bafefd5d0dcf265978ee2d5f5bfad"]

# Unit test dummy kubeadm tokens and CA cert hashes (not real secrets)
[[allowlists]]
description = "kubeadm unit test fixture data"
paths = ["kina-cli/src/core/apple_container.rs"]
regexTarget = "match"
regexes = [
    "abcdef\\.0123456789abcdef",
    "sha256:abc123def456",
]

# This test string decodes only to a PEM header, with no key material.
[[allowlists]]
description = "header-only kubeconfig fixture"
condition = "AND"
paths = ['''^kina-cli/tests/host_reachability_tests\.rs$''']
regexTarget = "match"
regexes = ['''^LS0tLS1CRUdJTiBFQyBQUklWQVRFIEtFWS0tLS0t$''']

# Historical Kubernetes log fields contain commit SHAs, not API credentials.
[[allowlists]]
description = "archived apiserver commit identifiers"
condition = "AND"
paths = ['''^docs/planning/archive/bees/issues-2026-11-27\.jsonl$''']
regexTarget = "match"
regexes = ['''^apiserver\.commit: [0-9a-f]{40}\\n$''']
