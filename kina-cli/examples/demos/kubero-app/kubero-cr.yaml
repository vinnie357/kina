# Kubero CR — vendored from kubero-operator v0.2.2's sample manifest, pinned
# and trimmed for kina (kina-53). Do not edit spec fields without also
# updating README.md's install walkthrough.
#
# Source (fetched at tag v0.2.2, HTTP 200 confirmed):
#   https://raw.githubusercontent.com/kubero-dev/kubero-operator/v0.2.2/config/samples/application_v1alpha1_kubero.yaml
#
# Changes from upstream:
#   - image.tag pinned to "v3.1.1" (upstream ships "latest")
#   - ingress.className set to "nginx", host set to kubero.<NODE_IP>.nip.io,
#     annotations nginx.org/ssl-redirect + nginx.org/websocket-services added
#     (kina ships NGINX Inc's ingress controller, not community ingress-nginx)
#   - registry.account block (username/password/bcrypt hash) removed — the
#     registry feature stays disabled (enabled: false, create: false) below,
#     so the block was dead config and a secret-scanner tripwire in a public
#     repo
#   - kubero.auditLogs.enabled stays "false" (upstream default) — this only
#     gates a SEPARATE, optional audit-log PVC. The chart also creates an
#     unconditional "kubero-data" PVC (1Gi) for the app's own SQLite DB at
#     /app/server/db, regardless of auditLogs. An earlier version of this
#     comment claimed auditLogs.enabled: false "keeps the install PVC-free"
#     — that was wrong (kina-53 validation run 1, live). See the next bullet
#     for the actual fix.
#   - kubero.database.storageClassName set to "local-path" (new). Upstream's
#     own chart default leaves this field unset, which the chart's pvc.yaml
#     template (helm-charts/kubero/templates/pvc.yaml @ v0.2.2) resolves to
#     an explicit storageClassName: "" on the kubero-data PVC — opting it
#     out of dynamic provisioning and default-class admission entirely, so
#     even a default StorageClass does not bind it (confirmed live). This
#     field is a valid CR field: the Kubero CRD's spec is fully open
#     (x-kubernetes-preserve-unknown-fields: true), and the operator maps
#     spec.kubero straight onto the chart's .Values.kubero. Requires
#     local-path-provisioner installed and marked cluster-default — see
#     README Prerequisites.
#
# buildPacks / templates / podSizeList / auth / clusterissuer are kept
# UNTRIMMED pending live validation — these may be required by the
# operator's reconcile loop and have not yet been confirmed safe to remove.
# clusterissuer references cert-manager, which this demo does not install;
# the field is left inert rather than deleted (no cert-manager means no
# ACME cert is ever issued from it).
#
# Deploy (double-quoted so $NODE_IP expands — single quotes would leave it
# literal and the API server rejects "$" in a DNS name):
#   NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
#   sed "s/<NODE_IP>/$NODE_IP/g" kubero-cr.yaml | kubectl apply -n kubero -f -
#
# Status: run 1 (kina-53 S2) validated this CR reconciles, but only via a
# manual static-PV + hostPath chown workaround applied outside this file —
# not via the database.storageClassName field below. That field is this
# round's (S3) direct fix for the same PVC-binding gap and has not itself
# been re-validated live yet; confirm in the next run.
apiVersion: application.kubero.dev/v1alpha1
kind: Kubero
metadata:
  name: kubero
spec:
  # Default values copied from <project_dir>/helm-charts/kubero/values.yaml
  affinity: {}
  fullnameOverride: ""
  image:
    pullPolicy: Always
    repository: ghcr.io/kubero-dev/kubero/kubero
    tag: "v3.1.1"
  imagePullSecrets: []
  ingress:
    annotations:
      nginx.org/ssl-redirect: "false"
      nginx.org/websocket-services: kubero
    className: nginx
    enabled: true
    hosts:
    - host: kubero.<NODE_IP>.nip.io
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls: []
  nameOverride: ""
  nodeSelector: {}
  podAnnotations: {}
  podSecurityContext: {}
  prometheus:
    enabled: false
    endpoint: http://kubero-prometheus-server # for internal access via service without ingress
  registry:
    enabled: false  # creates registry credentials for a external or a local registry (required for build strategy apps)
    create: false   # spins up a local registry
    public: true    # makes the registry public available
    #host: registry.kubero.svc.cluster.local  # works for pushes, but not for pulls. DO NOT USE THIS :( since it requires to configure all nodes ot acceppt this "insecure" registry
    #host: docker.io                          # requires a docker account. Might be the best choice when running on a non public domain
    host: registry.demo.kubero.dev            # will make your images publicly avaialble with a basic auth protection
    # account block (bcrypt credentials) removed — registry is disabled
    # above, so it was unused; see the header comment (kina-53 D10)
    port: 443
    storage: 1Gi
    storageClassName:
  replicaCount: 1
  resources: {}
  securityContext: {}
  service:
    port: 2000
    type: ClusterIP
  serviceAccount:
    annotations: {}
    create: true
    name: ""
  tolerations: []
  kubero:
    debug: ""
    namespace: kubero
    context: inClusterContext
    webhook_url: https://kubero.example.com/api/repo/webhooks
    sessionKey: "randomString"
    auth:
      github:
        enabled: false
        id: ""
        secret: ""
        callbackUrl: ""
        org: ""
      oauth2:
        enabled: false
        name: ""
        id: ""
        authUrl: ""
        tokenUrl: ""
        secret: ""
        callbackUrl: ""
        scopes: ""
    auditLogs:
      enabled: false
      storageClassName:
      accessModes:
        - ReadWriteOnce
      size: 0.1Gi
      limit: 1000
    # kina-53 D-new: binds the chart's unconditional "kubero-data" PVC
    # (the app's own SQLite DB) to a real StorageClass — see header comment.
    database:
      storageClassName: local-path
    config:
      kubero:
        readonly: false
        admin:
          disabled: false
        console:
          enabled: false
        banner:
          show: false
          message: "Welcome to Kubero!"
          bgcolor: "#8560A9"
          fontcolor: "azure"
      clusterissuer: letsencrypt-prod
      notifications: []
      templates:
        enabled: true
        catalogs:
        - name: "Kubero"
          description: "Kubero templates"
          templateBasePath: "https://raw.githubusercontent.com/kubero-dev/kubero/main/services/"
          index:
            url: "https://raw.githubusercontent.com/kubero-dev/templates/main/index.json"
            format: "json" # json or yaml # TODO has no effect yet. json is always used
        - name: "Kubero Frameworks"
          description: "Kubero templates"
          templateBasePath: "https://raw.githubusercontent.com/kubero-dev/kubero/main/services/"
          index:
            url: "https://raw.githubusercontent.com/kubero-dev/templates/main/index-frameworks.json"
            format: "json" # json or yaml # TODO has no effect yet. json is always used
      buildPacks:
        - name: NodeJS
          language: JavaScript
          fetch:
            repository: ghcr.io/kubero-dev/fetch
            tag: v1
            securityContext:
              runAsUser: 1000
          build:
            repository: node
            tag: latest
            command: "npm install"
            securityContext:
              runAsUser: 1000
          run:
            repository: node
            tag: latest
            command: "node index.js"
        - name: PHP
          language: PHP
          fetch:
            repository: ghcr.io/kubero-dev/fetch
            tag: v1
            securityContext:
              runAsUser: 1000
          build:
            repository: composer
            tag: latest
            command: "composer install; chown -R 1000:1000 /app"
          run:
            repository: webdevops/php-apache
            tag: "8.1"
            readOnlyAppStorage: false
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
            command: "apache2-foreground"
        - name: Python
          language: Python
          fetch:
            repository: ghcr.io/kubero-dev/fetch
            tag: v1
            securityContext:
              runAsUser: 1000
          build:
            repository: python
            tag: 3.10-buster
            command: "python3 -m venv .venv && . .venv/bin/activate && pip install -r requirements.txt"
          run:
            repository: python
            tag: 3.10-buster
            command: ". .venv/bin/activate && python3 main.py"
        - name: GoLang
          language: GoLang
          fetch:
            repository: ghcr.io/kubero-dev/fetch
            tag: v1
            securityContext:
              runAsUser: 1000
          build:
            repository: golang
            tag: alpine
            command: "go mod download && go mod verify && go build -v -o app"
          run:
            repository: golang
            tag: alpine
            command: "./app"
        - name: Hugo
          language: GoLang
          fetch:
            repository: ghcr.io/kubero-dev/fetch
            tag: v1
            securityContext:
              runAsUser: 1000
          build:
            repository: klakegg/hugo
            tag: latest
            command: hugo -D
          run:
            repository: caddy
            tag: latest
            command: caddy file-server --listen :8080 --root /app/public
        - name: Ruby
          language: Ruby
          fetch:
            repository: ghcr.io/kubero-dev/fetch
            tag: v1
            securityContext:
              runAsUser: 1000
          build:
            repository: ruby
            tag: "2.7"
            command: "export GEM_HOME=/app/bundle; bundle install --jobs=4 --retry=3"
          run:
            repository: ruby
            tag: "2.7"
            command: "export GEM_HOME=/app/bundle; bundle exec ruby main.rb"
        - name: Static
          language: HTML
          fetch:
            repository: ghcr.io/kubero-dev/fetch
            tag: v1
            securityContext:
              runAsUser: 1000
          build:
            repository: busybox
            tag: latest
            command: "echo 'Buildpack not required'"
          run:
            repository: caddy
            tag: latest
            command: caddy file-server --listen :8080 --root /app
      podSizeList:
      - name: small
        description: 'Small (CPU: 0.25, Memory: 0.5Gi)'
        default: true
        resources:
          requests:
            memory: 0.5Gi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 500m
      - name: medium
        description: 'Medium (CPU: 1, Memory: 2Gi)'
        resources:
          requests:
            memory: 2Gi
            cpu: 1000m
          limits:
            memory: 4Gi
            cpu: 2000m
      - name: large
        description: 'Large (CPU: 2, Memory: 4Gi)'
        active: false
        resources:
          requests:
            memory: 4Gi
            cpu: 2000m
          limits:
            memory: 4Gi
            cpu: 2000m
